<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background clipping mask for standard iOS/Android squircle -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" />
    </clipPath>

    <!-- Blue gradient for the lower body -->
    <linearGradient id="mainBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006ec7" />
      <stop offset="50%" stop-color="#0056aa" />
      <stop offset="100%" stop-color="#003d80" />
    </linearGradient>

    <!-- Starburst flare for SPARK letter A -->
    <radialGradient id="sparkAuraIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffedd5" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#f87171" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#009ee3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#009ee3" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle shield drop shadow filter -->
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001a38" flood-opacity="0.4" />
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- 1. Pure White Base Card -->
    <rect x="0" y="0" width="1024" height="1024" fill="#ffffff" />

    <!-- 2. Blue Curved Lower Section -->
    <path
      d="M 0,380 C 180,310 844,310 1024,380 L 1024,1024 L 0,1024 Z"
      fill="url(#mainBlueGrad)"
    />

    <!-- ================================================================= -->
    <!-- TOP SECTION: OFFICIAL SPARK MINDA CORPORATE LOGO                  -->
    <!-- ================================================================= -->
    <g transform="translate(112, 100) scale(0.833)">
      <!-- Left Blue Capsule -->
      <rect x="10" y="10" width="940" height="200" rx="30" ry="30" fill="#009ee3" />

      <!-- Right White Box for MINDA -->
      <rect x="490" y="10" width="460" height="200" rx="30" ry="30" fill="#ffffff" />
      <rect x="502" y="20" width="434" height="180" rx="20" ry="20" fill="#ffffff" stroke="#009ee3" stroke-width="7" />

      <!-- SPARK Letters -->
      <text x="45" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="112">S</text>
      <text x="128" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="112">P</text>

      <!-- Stylized A -->
      <g id="spark-a-icon">
        <circle cx="236" cy="56" r="44" fill="url(#sparkAuraIcon)" />
        <line x1="236" y1="10" x2="236" y2="106" stroke="#e31b23" stroke-width="2.8" stroke-linecap="round" />
        <line x1="184" y1="56" x2="288" y2="56" stroke="#e31b23" stroke-width="2.8" stroke-linecap="round" />
        <line x1="199" y1="21" x2="273" y2="91" stroke="#e31b23" stroke-width="2.4" stroke-linecap="round" />
        <line x1="199" y1="91" x2="273" y2="21" stroke="#e31b23" stroke-width="2.4" stroke-linecap="round" />
        <circle cx="236" cy="56" r="12" fill="#ffffff" opacity="0.65" />
        <circle cx="236" cy="56" r="5" fill="#ffffff" />
        <polygon points="236,52 242,59 204,158 184,158" fill="#e31b23" />
        <polygon points="236,52 230,59 268,158 288,158" fill="#e31b23" />
      </g>

      <text x="300" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="112">R</text>
      <text x="382" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="112">K</text>

      <!-- MINDA Text -->
      <text x="719" y="154" text-anchor="middle" fill="#009ee3" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="116" letter-spacing="1">MINDA</text>
    </g>

    <!-- ================================================================= -->
    <!-- CENTER SECTION: ORBITAL RING & SHIELD EMBLEM                      -->
    <!-- ================================================================= -->
    
    <!-- Diagonal Dynamic Shadow Effect for Modern App Icon Depth -->
    <path
      d="M 512,340 L 980,720 L 980,1024 L 512,1024 Z"
      fill="#002d60"
      opacity="0.32"
    />

    <!-- Outer Orbit Ring -->
    <circle
      cx="512"
      cy="600"
      r="305"
      fill="none"
      stroke="#ffffff"
      stroke-width="7.5"
    />

    <!-- 4 Orbiting Satellite Nodes (Top, Right, Bottom, Left) -->
    <circle cx="512" cy="295" r="24" fill="#ffffff" />
    <circle cx="817" cy="600" r="24" fill="#ffffff" />
    <circle cx="512" cy="905" r="24" fill="#ffffff" />
    <circle cx="207" cy="600" r="24" fill="#ffffff" />

    <!-- Outer Shield Contour (White Crest Outline) -->
    <path
      d="M 512,345 
         C 580,415 675,420 728,435 
         C 745,595 680,740 512,855 
         C 344,740 279,595 296,435 
         C 349,420 444,415 512,345 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linejoin="round"
    />

    <!-- Inner Solid White Shield (Main Badge) -->
    <path
      d="M 512,365 
         C 572,428 655,432 706,446 
         C 721,585 665,720 512,830 
         C 359,720 303,585 318,446 
         C 369,432 452,428 512,365 Z"
      fill="#ffffff"
      filter="url(#shieldShadow)"
    />

    <!-- Thin Inner Blue Shield Trim Line -->
    <path
      d="M 512,382 
         C 566,438 642,442 688,455 
         C 702,576 652,698 512,798 
         C 372,698 322,576 336,455 
         C 382,442 458,438 512,382 Z"
      fill="none"
      stroke="#006ec7"
      stroke-width="3"
    />

    <!-- ================================================================= -->
    <!-- SHIELD CONTENT: HARD HAT + "HSE" + 3 PILLARS (LEAF, HAZARD, TEAM) -->
    <!-- ================================================================= -->

    <!-- 1. Safety Helmet (Hard Hat) at top of shield -->
    <g transform="translate(436, 420) scale(0.76)">
      <!-- Hard Hat Dome -->
      <path
        d="M 12,100 C 12,35 70,0 100,0 C 130,0 188,35 188,100 Z"
        fill="#006ec7"
      />
      <!-- Helmet Ridges / Vent Highlights -->
      <path
        d="M 94,10 C 97,5 103,5 106,10 L 106,90 L 94,90 Z"
        fill="#ffffff"
        opacity="0.35"
      />
      <path
        d="M 64,25 C 67,20 73,20 76,25 L 70,90 L 58,90 Z"
        fill="#ffffff"
        opacity="0.25"
      />
      <path
        d="M 136,25 C 133,20 127,20 124,25 L 130,90 L 142,90 Z"
        fill="#ffffff"
        opacity="0.25"
      />
      <!-- Hard Hat Rim Base -->
      <rect x="0" y="90" width="200" height="24" rx="12" fill="#006ec7" />
      <rect x="18" y="104" width="164" height="8" rx="4" fill="#004d94" />
    </g>

    <!-- 2. "HSE" Bold Text in Center -->
    <text
      x="512"
      y="660"
      text-anchor="middle"
      fill="#002d60"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="124"
      letter-spacing="2"
    >
      HSE
    </text>

    <!-- 3. Bottom 3 Pillars (Environment Leaf, Safety Hazard, Health Team) -->
    <!-- Pillar 1: Green Leaf (Environment) -->
    <g transform="translate(390, 695) scale(0.68)">
      <path
        d="M 70,0 C 20,10 0,55 0,90 C 20,95 85,90 95,30 C 95,20 85,0 70,0 Z"
        fill="#16a34a"
      />
      <!-- Leaf center vein -->
      <path
        d="M 10,85 C 35,65 60,45 80,15"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        fill="none"
      />
      <!-- Leaf stem -->
      <path
        d="M 0,90 C -5,105 -5,115 -2,120"
        stroke="#16a34a"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"
      />
    </g>

    <!-- Pillar 2: Red Hazard Triangle with Exclamation (Safety) -->
    <g transform="translate(470, 692) scale(0.72)">
      <path
        d="M 45,6 C 52,-4 64,-4 71,6 L 112,80 C 119,92 110,104 96,104 L 20,104 C 6,104 -3,92 4,80 Z"
        fill="#dc2626"
      />
      <!-- Exclamation Mark -->
      <rect x="53" y="36" width="10" height="34" rx="5" fill="#ffffff" />
      <circle cx="58" cy="84" r="6" fill="#ffffff" />
    </g>

    <!-- Pillar 3: Blue Team / Worker Profile (Health) -->
    <g transform="translate(575, 694) scale(0.70)">
      <!-- Main Person Head -->
      <circle cx="42" cy="24" r="18" fill="#006ec7" />
      <!-- Main Person Body -->
      <path
        d="M 14,88 C 14,60 30,48 42,48 C 54,48 70,60 70,88 Z"
        fill="#006ec7"
      />
      <!-- Secondary Person Head -->
      <circle cx="76" cy="38" r="13" fill="#006ec7" />
      <!-- Secondary Person Body -->
      <path
        d="M 64,88 C 64,68 76,58 84,58 C 92,58 102,68 102,88 Z"
        fill="#006ec7"
      />
    </g>

    <!-- ================================================================= -->
    <!-- FOOTER SECTION: "PT MINDA AUTOMOTIVE INDONESIA"                   -->
    <!-- ================================================================= -->
    <text
      x="512"
      y="970"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="800"
      font-size="34"
      letter-spacing="2"
    >
      PT MINDA AUTOMOTIVE INDONESIA
    </text>
  </g>
</svg>
