<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT MINDA HSE Portal</title>
    
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="background-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MINDA HSE" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon.png?v=4.0" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/app_icon.jpg?v=4.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4.0" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=4.0" />
    <link rel="shortcut icon" href="/favicon.ico?v=4.0" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA Service Worker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('PWA Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
